<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-label="A test drives the ImapKit server, which pushes changes to IMAP clients">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- test file -->
  <g transform="translate(16 56)">
    <rect width="190" height="230" rx="12" fill="#ffffff" opacity="0.96"/>
    <rect width="190" height="30" rx="12" fill="#e3f2ea"/>
    <rect y="18" width="190" height="12" fill="#e3f2ea"/>
    <circle cx="16" cy="15" r="5" fill="#e06c75"/>
    <circle cx="32" cy="15" r="5" fill="#e5c07b"/>
    <circle cx="48" cy="15" r="5" fill="#98c379"/>
    <text x="70" y="20" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#1f5c3b">client.test.js</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="11">
      <text x="14" y="56" fill="#7c4dbd">const</text><text x="54" y="56" fill="#24292e">port =</text>
      <text x="14" y="72" fill="#24292e">  await server.start()</text>
      <text x="14" y="98" fill="#24292e">server.control</text>
      <text x="14" y="114" fill="#2e8555">  .addMessage(...)</text>
      <text x="14" y="140" fill="#24292e">server.script.add(</text>
      <text x="14" y="156" fill="#c2410c">  { on: 'response' })</text>
    </g>
    <g transform="translate(14 182)">
      <rect width="162" height="32" rx="6" fill="#e3f2ea"/>
      <circle cx="16" cy="16" r="9" fill="#2e8555"/>
      <path d="M11.5 16 L15 19.5 L21 12.5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="34" y="21" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1f5c3b">12 tests passed</text>
    </g>
  </g>
  <!-- arrows test to server -->
  <path d="M214 140 C 240 140, 240 150, 262 150" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <path d="M214 210 C 240 210, 240 200, 262 200" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <!-- server -->
  <g transform="translate(270 78)">
    <rect width="120" height="200" rx="14" fill="#1f5c3b" stroke="#ffffff" stroke-width="3"/>
    <rect x="16" y="20" width="88" height="34" rx="6" fill="#2e8555"/>
    <rect x="16" y="64" width="88" height="34" rx="6" fill="#2e8555"/>
    <rect x="16" y="108" width="88" height="34" rx="6" fill="#2e8555"/>
    <circle cx="30" cy="37" r="4" fill="#98c379"/><circle cx="30" cy="81" r="4" fill="#98c379"/><circle cx="30" cy="125" r="4" fill="#e5c07b"/>
    <rect x="42" y="34" width="50" height="6" rx="3" fill="#ffffff" opacity="0.7"/>
    <rect x="42" y="78" width="50" height="6" rx="3" fill="#ffffff" opacity="0.7"/>
    <rect x="42" y="122" width="50" height="6" rx="3" fill="#ffffff" opacity="0.7"/>
    <text x="60" y="176" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">IMAP</text>
    <!-- lightning: scripted faults -->
    <g transform="translate(92 -18)">
      <circle cx="18" cy="18" r="18" fill="#e5c07b"/>
      <path d="M21 6 L11 20 H18 L15 30 L25 15 H18 Z" fill="#1f5c3b"/>
    </g>
  </g>
  <!-- arrows server to clients -->
  <path d="M398 120 C 430 120, 430 92, 458 92" fill="none" stroke="#ffffff" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M398 178 L 456 178" fill="none" stroke="#ffffff" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M398 236 C 430 236, 430 264, 458 264" fill="none" stroke="#ffffff" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- clients: envelopes -->
  <g transform="translate(464 68)">
    <rect width="76" height="48" rx="7" fill="#ffffff"/>
    <path d="M6 8 L38 30 L70 8" fill="none" stroke="#2e8555" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="38" y="66" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#ffffff">* 3 EXISTS</text>
  </g>
  <g transform="translate(464 154)">
    <rect width="76" height="48" rx="7" fill="#ffffff"/>
    <path d="M6 8 L38 30 L70 8" fill="none" stroke="#2e8555" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="38" y="66" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#ffffff">* 2 EXPUNGE</text>
  </g>
  <g transform="translate(464 240)">
    <rect width="76" height="48" rx="7" fill="#ffffff"/>
    <path d="M6 8 L38 30 L70 8" fill="none" stroke="#2e8555" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="38" y="66" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#ffffff">A1 BAD</text>
  </g>
</svg>
