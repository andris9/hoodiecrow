# Drop-in configuration for the Dovecot reference server used by compare/compare.js.
# Mounted into /etc/dovecot/conf.d/ of the dovecot/dovecot:2.4.x image. The image
# uses a static passdb, so any username logs in with the password set in
# USER_PASSWORD and gets its own empty mail home.

# compare.js connects over plain TCP, so cleartext logins must be allowed
auth_allow_cleartext = yes

# Full-text search makes SEARCH TEXT/BODY fuzzy (stemming, tokenizing). Turn it
# off so SEARCH uses plain substring matching as RFC 3501 describes.
mail_plugins {
  fts = no
  fts_flatcurve = no
}

# The image auto-creates special-use mailboxes for every user. Turn that off so
# the mailbox tree only contains what the storage JSON describes, the same as
# hoodiecrow.
namespace inbox {
  mailbox Sent {
    auto = no
    special_use =
  }
  mailbox Drafts {
    auto = no
    special_use =
  }
  mailbox Junk {
    auto = no
    special_use =
  }
  mailbox Trash {
    auto = no
    special_use =
  }
}
